name: Build Nova Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0b327-nova-final-complete
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build Nova
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Nova
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.31.6"

      - name: Verify Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "NDK:"
          test -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties"
          cat "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties"

          echo ""
          echo "CMake:"
          test -f "$ANDROID_SDK_ROOT/cmake/3.31.6/bin/cmake"
          "$ANDROID_SDK_ROOT/cmake/3.31.6/bin/cmake" --version

          echo ""
          echo "Clang:"
          "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Configure native environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build Nova Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.native.buildOutput=verbose 2>&1 | tee build-log.txt

      - name: Find APK
        if: success()
        run: |
          echo "===== GENERATED APK ====="
          find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Publish outputs into branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p ci-artifacts
          if [ -f build-log.txt ]; then
            # keep the log bounded: the interesting stuff (errors) is at the end
            tail -c 900000 build-log.txt > ci-artifacts/build-log.txt
          fi

          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -1 || true)
          if [ -n "$APK" ]; then
            cp "$APK" ci-artifacts/Nova-debug.apk
            ls -la ci-artifacts/
          fi

          git add ci-artifacts
          # *.apk is gitignored in this repo; force-add the deliverable
          if [ -f ci-artifacts/Nova-debug.apk ]; then
            git add -f ci-artifacts/Nova-debug.apk
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "CI artifacts for run $GITHUB_RUN_ID [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload Nova APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Nova-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
