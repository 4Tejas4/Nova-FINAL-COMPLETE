name: Build Nova Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Nova
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Nova
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Verify Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "NDK:"
          test -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties"
          cat "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties"

          echo ""
          echo "CMake:"
          test -f "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

          echo ""
          echo "Clang:"
          "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Configure native environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Check Gradle
        run: |
          ./gradlew --version

      - name: Show Gradle projects
        run: |
          ./gradlew projects --no-daemon

      - name: Build Nova Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Pandroid.native.buildOutput=verbose

      - name: Find APK
        if: success()
        run: |
          echo "===== GENERATED APK ====="
          find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload Nova APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Nova-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Nova-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
            **/llama-android/.cxx/**
          if-no-files-found: ignore
