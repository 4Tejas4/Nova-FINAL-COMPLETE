name: Build Nova Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Nova
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Nova
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Verify native toolchain
        run: |
          test -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties"
          test -f "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

      - name: Configure native environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle project
        run: |
          ./gradlew --version
          ./gradlew projects --no-daemon

      - name: Build Nova Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Nova APK
        uses: actions/upload-artifact@v6
        with:
          name: Nova-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Nova-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
